[project]
name = "pickbeststocks"
version = "0.1.0"
description = "PickBestStocks using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.10.1"
]

[project.scripts]
pickbeststocks = "pickbeststocks.main:run"
run_crew = "pickbeststocks.main:run"
train = "pickbeststocks.main:train"
replay = "pickbeststocks.main:replay"
test = "pickbeststocks.main:test"
run_with_trigger = "pickbeststocks.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
